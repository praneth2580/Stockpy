name: StockPy F&O Pre-Market

# Scheduled ~30 minutes early so GitHub Actions delay still lands near market open.
# Intended delivery windows (IST), cron is UTC:
#   Premarket  → cron 02:30 UTC (≈08:00 IST)  → aim ~09:00 IST after delay
#   Open       → cron 02:45 UTC (≈08:15 IST)  → aim ~09:15 IST
#   Confirm    → cron 03:00 UTC (≈08:30 IST)  → aim ~09:30 IST
#
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "30 2 * * 1-5"
    - cron: "45 2 * * 1-5"
    - cron: "0 3 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: "premarket"
        type: choice
        options:
          - premarket
          - open
          - confirm
          - accuracy
      send_ping:
        description: "Also send a Telegram connectivity ping ( clutters chat — off by default )"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PREMARKET_NOTIFY: "true"
  PREMARKET_DB_PATH: data/premarket.db
  PREMARKET_TIMEZONE: Asia/Kolkata
  TZ: Asia/Kolkata

jobs:
  premarket:
    name: F&O pre-market job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous premarket DB (best-effort)
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          name: premarket-db
          workflow: stockpy-premarket.yml
          workflow_conclusion: success
          path: data
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Ensure data directory
        run: mkdir -p data

      - name: Detect job from schedule / dispatch
        id: slot
        run: |
          IST_NOW=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')
          echo "ist_now=${IST_NOW}"
          echo "ist_time=$(TZ=Asia/Kolkata date +%H:%M)" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }}"
          echo "schedule='${{ github.event.schedule }}'"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
            echo "force_flag=--force" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch → job=${{ inputs.job }} (forced)"
            exit 0
          fi

          # Map cron expression → job (reliable even when runner is early/late).
          SCHEDULE="${{ github.event.schedule }}"
          case "$SCHEDULE" in
            "30 2 * * 1-5") JOB=premarket ;;
            "45 2 * * 1-5") JOB=open ;;
            "0 3 * * 1-5")  JOB=confirm ;;
            *)
              echo "Unknown schedule '$SCHEDULE' — defaulting to premarket"
              JOB=premarket
              ;;
          esac
          echo "force_flag=" >> "$GITHUB_OUTPUT"
          echo "job=${JOB}" >> "$GITHUB_OUTPUT"
          echo "Selected job=${JOB} from schedule"

      - name: Skip if NSE holiday / weekend
        id: calendar
        if: steps.slot.outputs.job != 'accuracy'
        run: |
          python - <<'PY'
          import os
          from scanner.premarket.calendar import is_trading_day, now_ist

          force = os.environ.get("FORCE_FLAG", "").strip() == "--force"
          d = now_ist().date()
          open_ = is_trading_day(d) or force
          print(f"date={d.isoformat()} trading_day={is_trading_day(d)} force={force}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"trading_day={'true' if open_ else 'false'}\n")
          PY
        env:
          FORCE_FLAG: ${{ steps.slot.outputs.force_flag }}

      - name: Telegram config check (no chat spam)
        run: |
          python - <<'PY'
          import os
          import sys

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          print("=== Telegram env diagnostics (no ping sent) ===")
          print(f"TELEGRAM_BOT_TOKEN set: {bool(token)} len={len(token)}")
          print(f"TELEGRAM_CHAT_ID set: {bool(chat)} value={chat or '(empty)'}")
          print(f"PREMARKET_NOTIFY={os.getenv('PREMARKET_NOTIFY')}")
          if not token or not chat:
              print("::warning title=Telegram secrets missing::"
                    "Reports will run but no Telegram message will be sent.")
          else:
              print("Secrets present. Only the main glance message will be sent.")
          PY

      - name: Optional Telegram ping (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.send_ping == true
        run: |
          python - <<'PY'
          import os
          import sys
          from scanner.notifier import ping_telegram

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              print("::error title=Telegram secrets missing::Cannot ping.")
              sys.exit(1)
          ok = ping_telegram(token, chat)
          sys.exit(0 if ok else 1)
          PY

      - name: Run F&O job
        id: run_job
        if: steps.slot.outputs.job == 'accuracy' || steps.calendar.outputs.trading_day == 'true'
        run: |
          JOB="${{ steps.slot.outputs.job }}"
          FORCE="${{ steps.slot.outputs.force_flag }}"
          echo "========================================"
          echo "Running job=$JOB force='$FORCE'"
          echo "========================================"
          case "$JOB" in
            premarket) python main.py --premarket $FORCE --dev ;;
            open)      python main.py --premarket-open $FORCE --dev ;;
            confirm)   python main.py --premarket-confirm $FORCE --dev ;;
            accuracy)  python main.py --premarket-accuracy ;;
            *) echo "Unknown job: $JOB"; exit 1 ;;
          esac
          echo "========================================"
          echo "Job finished. Search log for [telegram] lines above."
          echo "========================================"

      - name: Skipped (non-trading day)
        if: steps.slot.outputs.job != 'accuracy' && steps.calendar.outputs.trading_day != 'true'
        run: |
          echo "::warning title=Job skipped::Not an NSE trading day. Re-run via workflow_dispatch."
          echo "Skipping — not an NSE trading day."

      - name: Upload premarket DB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-db
          path: data/premarket.db
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockpy-log-${{ steps.slot.outputs.job }}
          path: stockpy.log
          if-no-files-found: ignore
          retention-days: 14
