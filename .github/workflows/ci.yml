name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -q --tb=short

      - name: Import smoke check
        run: |
          python - <<'PY'
          from scanner.config import PREMARKET, DEFAULT_SETTINGS
          from scanner.premarket.calendar import is_trading_day
          from scanner.premarket.analysis.gap import compute_gap, classify_gap
          assert "report_time" in PREMARKET
          assert DEFAULT_SETTINGS["workers"] >= 1
          g, p, k = compute_gap(24850, 24930)
          assert g == 80.0 and k is not None
          print("smoke ok", classify_gap(0.2))
          PY
