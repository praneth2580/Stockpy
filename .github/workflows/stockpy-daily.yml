name: StockPy Daily Equity Scan

# NSE Top-50 screen after Indian market hours (approx).
# 10:00 UTC ≈ 15:30 IST (near cash close). Mon–Fri only.

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  STOCKPY_WORKERS: "4"
  STOCKPY_PERIOD: "1y"
  TZ: Asia/Kolkata

jobs:
  top50-scan:
    name: NSE Top-50 → Top-10
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if NSE holiday / weekend
        id: calendar
        run: |
          python - <<'PY'
          import os
          from scanner.premarket.calendar import is_trading_day, now_ist

          d = now_ist().date()
          open_ = is_trading_day(d)
          print(f"date={d.isoformat()} trading_day={open_}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"trading_day={'true' if open_ else 'false'}\n")
          PY

      - name: Telegram config check
        run: |
          python - <<'PY'
          import os
          print("=== Telegram env diagnostics (secrets masked) ===")
          token = os.getenv("TELEGRAM_BOT_TOKEN", "")
          chat = os.getenv("TELEGRAM_CHAT_ID", "")
          print(f"TELEGRAM_BOT_TOKEN set: {bool(token.strip())} len={len(token.strip())}")
          print(f"TELEGRAM_CHAT_ID set: {bool(chat.strip())} value={chat.strip() or '(empty)'}")
          if not token.strip() or not chat.strip():
              print("::warning title=Telegram secrets missing::Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repo Actions secrets.")
          else:
              print("Secrets present. Delivery result will appear as [telegram] lines below.")
          PY

      - name: Run daily top-50 scan
        if: steps.calendar.outputs.trading_day == 'true'
        run: python main.py --top50 --dev

      - name: Skipped (non-trading day)
        if: steps.calendar.outputs.trading_day != 'true'
        run: echo "Skipping equity scan — not an NSE trading day."
