name: StockPy Daily Equity Scan

# NSE Top-50 screen after Indian market hours (approx).
# Cron is ~30 min early to absorb GitHub Actions delay:
#   09:30 UTC ≈ 15:00 IST  → often lands near 15:30 IST
# Mon–Fri only.

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  STOCKPY_WORKERS: "4"
  STOCKPY_PERIOD: "1y"
  TZ: Asia/Kolkata

jobs:
  top50-scan:
    name: NSE Top-50 → Top-10
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if NSE holiday / weekend
        id: calendar
        run: |
          python - <<'PY'
          import os
          from scanner.premarket.calendar import is_trading_day, now_ist

          d = now_ist().date()
          open_ = is_trading_day(d)
          print(f"date={d.isoformat()} trading_day={open_}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"trading_day={'true' if open_ else 'false'}\n")
          PY

      - name: Telegram config check (no chat spam)
        run: |
          python - <<'PY'
          import os

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          print("=== Telegram env diagnostics (no ping sent) ===")
          print(f"TELEGRAM_BOT_TOKEN set: {bool(token)} len={len(token)}")
          print(f"TELEGRAM_CHAT_ID set: {bool(chat)} value={chat or '(empty)'}")
          if not token or not chat:
              print("::warning title=Telegram secrets missing::"
                    "Scan will run but no Telegram message will be sent.")
          else:
              print("Secrets present. Only the scan summary will be sent.")
          PY

      - name: Run daily top-50 scan
        if: steps.calendar.outputs.trading_day == 'true'
        run: python main.py --top50 --dev

      - name: Skipped (non-trading day)
        if: steps.calendar.outputs.trading_day != 'true'
        run: echo "Skipping equity scan — not an NSE trading day."
